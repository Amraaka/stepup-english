<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: transparent; }
    a { color: #C8361B; } a:hover { color: #FF5A3C; }
  </style>
</helmet>
<div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
  <svg viewBox="0 0 120 120" style="width: 100%; height: 100%; overflow: visible;">
    <ellipse cx="60" cy="114" rx="28" ry="4" fill="#121215" opacity="0.12"></ellipse>
    <g style="display: {{show.armsUp}}">
      <path d="M30 74 L12 50" stroke="#FF5A3C" stroke-width="10" stroke-linecap="round" fill="none"></path>
      <path d="M90 74 L108 50" stroke="#FF5A3C" stroke-width="10" stroke-linecap="round" fill="none"></path>
    </g>
    <g style="display: {{show.armsDown}}">
      <path d="M24 82 L13 94" stroke="#FF5A3C" stroke-width="10" stroke-linecap="round" fill="none"></path>
      <path d="M96 82 L107 94" stroke="#FF5A3C" stroke-width="10" stroke-linecap="round" fill="none"></path>
    </g>
    <path d="M60 18 C86 18 102 43 102 71 C102 98 84 111 60 111 C36 111 18 98 18 71 C18 43 34 18 60 18 Z" fill="#FF5A3C"></path>
    <ellipse cx="60" cy="92" rx="26" ry="15" fill="#FFFFFF" opacity="0.16"></ellipse>
    <path d="M21 60 C23 34 43 16 69 18 C88 20 99 31 103 45 C93 34 78 28 62 30 C44 32 30 44 21 60 Z" fill="#1B222C"></path>
    <path d="M73 31 Q84 23 93 17" stroke="#FF4D6D" stroke-width="4" stroke-linecap="round" fill="none"></path>
    <circle cx="97" cy="14" r="6" fill="#FF4D6D"></circle>
    <g style="display: {{show.eyesOpen}}">
      <ellipse cx="47" cy="67" rx="10" ry="11" fill="#FFFFFF"></ellipse>
      <ellipse cx="75" cy="67" rx="10" ry="11" fill="#FFFFFF"></ellipse>
      <circle cx="49" cy="{{show.pupilY}}" r="5" fill="#121215"></circle>
      <circle cx="77" cy="{{show.pupilY}}" r="5" fill="#121215"></circle>
      <circle cx="51" cy="65" r="1.8" fill="#FFFFFF"></circle>
      <circle cx="79" cy="65" r="1.8" fill="#FFFFFF"></circle>
    </g>
    <g style="display: {{show.eyesClosed}}">
      <path d="M38 68 Q47 74 56 68" stroke="#121215" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
      <path d="M66 68 Q75 74 84 68" stroke="#121215" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
    </g>
    <ellipse cx="34" cy="83" rx="6" ry="3.5" fill="#FF4D6D" opacity="0.45"></ellipse>
    <ellipse cx="88" cy="83" rx="6" ry="3.5" fill="#FF4D6D" opacity="0.45"></ellipse>
    <path style="display: {{show.smile}}" d="M51 86 Q61 95 71 86" stroke="#121215" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
    <path style="display: {{show.open}}" d="M49 84 Q61 104 73 84 Z" fill="#121215"></path>
    <circle style="display: {{show.o}}" cx="61" cy="90" r="4.5" fill="#121215"></circle>
    <path style="display: {{show.calm}}" d="M54 89 Q61 93 68 89" stroke="#121215" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{"mood":{"editor":"enum","options":["happy","cheer","think","calm"],"default":"happy"},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood ?? 'happy';
    const on = (b) => (b ? 'inline' : 'none');
    return {
      show: {
        armsUp: on(m === 'cheer'),
        armsDown: on(m !== 'cheer'),
        eyesOpen: on(m !== 'calm'),
        eyesClosed: on(m === 'calm'),
        pupilY: m === 'think' ? 63 : 68,
        smile: on(m === 'happy'),
        open: on(m === 'cheer'),
        o: on(m === 'think'),
        calm: on(m === 'calm'),
      },
    };
  }
}
</script>
</body>
</html>
