<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; background: #121215; font-family: Manrope, "Segoe UI", system-ui, sans-serif; color: #EDEDF0; -webkit-font-smoothing: antialiased; }
    a { color: #FF7A5C; } a:hover { color: #FFFFFF; }
    p, h1 { margin: 0; }
    .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .num { font-variant-numeric: tabular-nums; }
    @keyframes rise { from { transform: translateY(24px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #121215; position: relative; overflow: hidden;">
  <div style="position: absolute; left: -60px; right: -60px; top: 40px; height: 480px; background: radial-gradient(50% 50% at 50% 45%, rgba(255,90,60,0.45), rgba(255,90,60,0) 70%);"></div>
  <span style="position: absolute; left: 48px; top: 110px; width: 10px; height: 18px; border-radius: 3px; background: #F5A300; transform: rotate(-24deg);"></span>
  <span style="position: absolute; left: 320px; top: 90px; width: 10px; height: 18px; border-radius: 3px; background: #2F7FF0; transform: rotate(30deg);"></span>
  <span style="position: absolute; left: 90px; top: 300px; width: 8px; height: 8px; border-radius: 50%; background: #1FB57A;"></span>
  <span style="position: absolute; left: 300px; top: 270px; width: 10px; height: 18px; border-radius: 3px; background: #7B5CFA; transform: rotate(-40deg);"></span>
  <span style="position: absolute; left: 36px; top: 220px; width: 8px; height: 8px; border-radius: 50%; background: #FF4D6D;"></span>
  <span style="position: absolute; left: 342px; top: 190px; width: 8px; height: 8px; border-radius: 50%; background: #F5A300;"></span>

  <div style="position: relative; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 64px 20px 32px;">
    <div style="width: 200px; height: 200px; animation: rise 600ms cubic-bezier(.2,.8,.2,1) both;">
      <dc-import name="Mascot" mood="cheer" hint-size="200px,200px"></dc-import>
    </div>
    <p class="num" style="font-size: 120px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; color: #FF7A5C; margin-top: 8px; animation: pop 700ms 150ms cubic-bezier(.2,.8,.2,1) both;">12</p>
    <h1 style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">хоног дараалан!</h1>
    <p style="font-size: 14px; color: #A0A0AA; margin-top: 8px; text-align: center;">Өдөр бүр жаахан ахих нь хамгийн том ялалт.</p>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 28px; padding: 14px; box-sizing: border-box; border-radius: 22px; background: rgba(237,237,240,0.06);">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #A0A0AA; font-weight: 700;">Да</span><span style="width: 32px; height: 32px; border-radius: 50%; background: #FF5A3C;"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #A0A0AA; font-weight: 700;">Мя</span><span style="width: 32px; height: 32px; border-radius: 50%; background: #FF5A3C;"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #A0A0AA; font-weight: 700;">Лх</span><span style="width: 32px; height: 32px; border-radius: 50%; background: #FF5A3C;"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #A0A0AA; font-weight: 700;">Пү</span><span style="width: 32px; height: 32px; border-radius: 50%; background: #2F7FF0;"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #A0A0AA; font-weight: 700;">Ба</span><span style="width: 32px; height: 32px; border-radius: 50%; background: #FF5A3C;"></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #FFFFFF; font-weight: 800;">Бя</span><span style="width: 32px; height: 32px; border-radius: 50%; background: #FF5A3C; box-shadow: 0 0 0 4px rgba(255,90,60,0.3); display: flex; align-items: center; justify-content: center; color: #121215;"><svg class="i" viewBox="0 0 20 20" style="stroke-width: 2.8; width: 16px; height: 16px;"><path d="M5 10.5l3.2 3L15 6.5"></path></svg></span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 11px; color: #5C5C66; font-weight: 700;">Ня</span><span style="width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; border: 2px dashed rgba(237,237,240,0.2);"></span></div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 16px; height: 36px; padding: 0 14px; border-radius: 999px; background: rgba(245,163,0,0.16); color: #F5B233; font-size: 13px; font-weight: 800;">
      <svg class="i" viewBox="0 0 20 20" style="fill: #F5B233; stroke: #F5B233; width: 16px; height: 16px;"><path d="M11 2.5 4.5 11H10l-1 6.5L15.5 9H10l1-6.5Z"></path></svg>
      +20 оноо урамшуулал
    </div>

    <div style="flex: 1;"></div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 56px; border-radius: 18px; background: #FF5A3C; color: #121215; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #C8361B;">Үргэлжлүүлэх</div>
      <div style="height: 52px; border-radius: 18px; border: 1.5px solid rgba(237,237,240,0.2); color: #EDEDF0; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg class="i" viewBox="0 0 20 20" style="width: 18px; height: 18px;"><path d="M10 12.5V3M6.5 6.5 10 3l3.5 3.5M4.5 10.5v5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-5"></path></svg>Хуваалцах</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
