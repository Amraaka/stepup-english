<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; background: transparent; font-family: Manrope, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C8361B; } a:hover { color: #FF5A3C; }
  </style>
</helmet>
<div style="width: 100%; height: 84px; box-sizing: border-box; background: rgba(255,255,255,0.94); border-top: 1px solid rgba(160,160,170,0.22); display: flex; align-items: flex-start; justify-content: space-between; padding: 8px 10px 0;">
  <sc-for list="{{items}}" as="item" hint-placeholder-count="5">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px;">
      <div style="width: 52px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{item.bg}}; color: {{item.color}};">
        <svg viewBox="0 0 20 20" style="width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="{{item.d}}"></path></svg>
      </div>
      <span style="font-size: 11px; font-weight: {{item.weight}}; color: {{item.color}};">{{item.label}}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","options":["home","learn","quests","league","profile"],"default":"home"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const defs = [
      { id: 'home', label: 'Нүүр', d: 'M3.5 8.5 10 3l6.5 5.5V16a1 1 0 0 1-1 1h-3.6v-4.6H8.1V17H4.5a1 1 0 0 1-1-1V8.5Z' },
      { id: 'learn', label: 'Суралцах', d: 'M3.5 5.5 8 3.5l4 2 4.5-2v11L12 16.5l-4-2-4.5 2v-11Z M8 3.5v11 M12 5.5v11' },
      { id: 'quests', label: 'Даалгавар', d: 'M17 10a7 7 0 1 1-14 0a7 7 0 1 1 14 0Z M13.5 10a3.5 3.5 0 1 1-7 0a3.5 3.5 0 1 1 7 0Z M10.8 10a.8.8 0 1 1-1.6 0a.8.8 0 1 1 1.6 0Z' },
      { id: 'league', label: 'Лиг', d: 'M10 2.5 16 5v5c0 3.8-2.6 6.4-6 7.5C6.6 16.4 4 13.8 4 10V5l6-2.5Z M7.5 9.5l1.8 1.8 3.2-3.3' },
      { id: 'profile', label: 'Профайл', d: 'M13.2 7a3.2 3.2 0 1 1-6.4 0a3.2 3.2 0 1 1 6.4 0Z M4 17c.8-3 3.2-4.4 6-4.4S15.2 14 16 17' },
    ];
    return {
      items: defs.map((x) => ({
        ...x,
        color: x.id === active ? '#C8361B' : '#5C5C66',
        bg: x.id === active ? '#FFE4DD' : 'transparent',
        weight: x.id === active ? 800 : 600,
      })),
    };
  }
}
</script>
</body>
</html>
