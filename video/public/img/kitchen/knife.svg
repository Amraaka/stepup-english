    <!-- blade -->
    <path d="M26 86h100v24H60C44 110 32 100 26 86z" fill="#dfe3e8"/>
    <!-- handle -->
    <path d="M126 84h38a12 12 0 0 1 12 12 12 12 0 0 1-12 12h-38z" fill="#b5764a"/>
  </g>
</svg>
