<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- v3: compact plug head with a short straight cable and a connector tip.
       v1 was a wide slab, v2 a plain square with a dangling curl — both read as a
       sign on a post. The silhouette itself has to say "plug". -->
  <g stroke="#1a1a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- pins -->
    <path d="M88 30v22M112 30v22" stroke-width="9"/>
    <!-- plug head: squat, wider than tall, shoulders tapering to the cable -->
    <path d="M70 52h60a10 10 0 0 1 10 10v34a10 10 0 0 1-10 10h-60a10 10 0 0 1-10-10V62a10 10 0 0 1 10-10z" fill="#e7e1ff"/>
    <!-- straight cable -->
    <path d="M100 106v42" stroke-width="8"/>
    <!-- connector tip -->
    <path d="M90 148h20v16a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6z" fill="#7b5cfa"/>
  </g>
</svg>
