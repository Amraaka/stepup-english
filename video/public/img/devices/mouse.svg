<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- replaces "charger", which has no distinctive silhouette at icon scale: three
       attempts all read as a sign/mirror on a stick. A mouse is one clean ovoid. -->
  <g stroke="#1a1a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- body: one continuous rounded ovoid -->
    <path d="M100 26c26 0 44 22 44 52v44c0 30-18 52-44 52s-44-22-44-52V78c0-30 18-52 44-52z" fill="#e7e1ff"/>
    <!-- split between the buttons -->
    <path d="M56 86h88" stroke-width="4"/>
    <path d="M100 26v60" stroke-width="4"/>
    <!-- scroll wheel -->
    <circle cx="100" cy="58" r="8" fill="#7b5cfa"/>
  </g>
</svg>
