<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- v2: portrait cover with stacked page edges down the fore-edge. v1 was a near
       square slab with a thin spine and read as a folder or a tile. -->
  <g stroke="#1a1a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- page block, offset right so the edges show -->
    <path d="M62 30h82a8 8 0 0 1 8 8v124a8 8 0 0 1-8 8H62z" fill="#ffffff"/>
    <!-- page lines along the fore-edge -->
    <path d="M140 46v108M128 46v108" stroke-width="4"/>
    <!-- cover -->
    <path d="M56 24h72a10 10 0 0 1 10 10v132a10 10 0 0 1-10 10H56z" fill="#1fb57a"/>
    <!-- spine -->
    <path d="M44 24h12v152H44a8 8 0 0 1-8-8V32a8 8 0 0 1 8-8z" fill="#138a5a"/>
  </g>
</svg>
