<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.h1s{font:800 60px/1.08 Manrope;letter-spacing:-.04em;margin:0 0 30px}
.ladder{gap:12px;margin-top:0}
.rung{display:grid;grid-template-columns:300px 52px 1fr;align-items:center;gap:24px;padding:17px 36px;border-radius:28px}
.rung .old{font:700 40px/1.1 Manrope;color:rgba(255,255,255,.55)}
.rung .arw{font:800 38px Manrope;color:var(--acc);text-align:center}
.rung .new{display:block;font:800 54px/1.05 Manrope;letter-spacing:-.02em;color:var(--acc)}
.tag{font-size:24px}
.ft{font-size:27px}
</style></head><body>
<div class="s M D">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag f">Vocabulary</div></div>
  <div class="mid">
    <div class="h1s">"Very"-гийн оронд<br><em>эдгээр үгийг</em> хэрэглээрэй</div>
    <div class="ladder">
      <div class="glass rung"><span class="old">very tired</span><span class="arw">→</span><span class="new">exhausted</span></div>
      <div class="glass rung"><span class="old">very happy</span><span class="arw">→</span><span class="new">thrilled</span></div>
      <div class="glass rung"><span class="old">very big</span><span class="arw">→</span><span class="new">huge</span></div>
      <div class="glass rung"><span class="old">very cold</span><span class="arw">→</span><span class="new">freezing</span></div>
      <div class="glass rung"><span class="old">very good</span><span class="arw">→</span><span class="new">excellent</span></div>
      <div class="glass rung"><span class="old">very bad</span><span class="arw">→</span><span class="new">terrible</span></div>
      <div class="glass rung"><span class="old">very hungry</span><span class="arw">→</span><span class="new">starving</span></div>
      <div class="glass rung"><span class="old">very small</span><span class="arw">→</span><span class="new">tiny</span></div>
    </div>
  </div>
  <div class="ft"><span>Чи алийг нь хамгийн их хэрэглэх вэ?</span><span class="go">Хадгал →</span></div>
</div></body></html>
