<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.mid{min-height:0;justify-content:flex-start}
.hud{margin-top:40px;font-size:28px}
.xp{height:34px;border-width:4px}
.qtop{font:800 58px/1.06 Manrope;letter-spacing:-.03em;margin-top:40px}
.qtop em{font-style:normal;color:var(--acc)}
.qbox{margin-top:36px;padding:38px 40px;box-shadow:12px 12px 0 var(--line)}
.qi{display:flex;gap:24px;align-items:center;padding:22px 0;border-bottom:3px solid var(--edge)}

.qn{font:400 28px/1.5 Silkscreen,monospace;color:var(--acc);flex:0 0 46px}
.qi .en{font:800 50px/1.15 Manrope;letter-spacing:-.02em}
.blank{display:inline-block;width:140px;border-bottom:7px solid var(--acc);margin:0 8px;vertical-align:4px}
.grid4{grid-template-columns:repeat(4,1fr);gap:20px;margin-top:38px;margin-bottom:14px}
.ob{padding:24px 20px;font:800 48px Manrope;justify-content:center;gap:0;flex-direction:column;box-shadow:8px 8px 0 var(--line)}
.ob b{font:400 24px Silkscreen,monospace;margin-bottom:12px}
.ob.none{font-size:32px;line-height:60px;color:var(--mut)}
.tag{font-size:24px}
.ft{font-size:26px}
</style></head><body>
<div class="s D">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag f">Quiz · a / an / the</div></div>

    <div class="qbox">
      <div class="qi"><div class="qn">1</div><div><div class="en">I have<span class="blank"></span>idea!</div></div></div>

      <div class="qi"><div class="qn">5</div><div><div class="en"><span class="blank"></span>phone was cheap.</div></div></div>
    </div>
    <div class="grid4">
      <div class="ob"><b>A</b>a</div>
      <div class="ob"><b>B</b>an</div>
      <div class="ob"><b>C</b>the</div>
      <div class="ob none"><b>D</b>юу ч биш</div>
    </div>
  </div>
  <div class="ft"><span>Хариултаа коммент хэсэгт үлдээгээрэй 👇</span><span class="go">+50 XP</span></div>
</div></body></html>
