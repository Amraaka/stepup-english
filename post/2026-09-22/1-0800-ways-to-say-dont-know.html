<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.top{display:grid;grid-template-columns:1fr 250px;gap:22px;align-items:center;margin-top:10px}
.h{font:800 66px/1.08 Manrope;letter-spacing:-.04em}
.h em{font-style:normal;color:var(--acc)}
.deck{position:relative;height:210px}
.deck .c1,.deck .c2{position:absolute;left:0;right:0;top:16px;height:178px;border-radius:30px;border:3px solid var(--line)}
.deck .c2{background:var(--acc2);transform:rotate(7deg) translate(16px,-10px)}
.deck .c1{background:var(--card);transform:rotate(-3.5deg);box-shadow:12px 12px 0 var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 20px}
.deck .fk{font:800 22px Manrope;letter-spacing:.2em;color:var(--mut)}
.deck .fw{font:800 44px/1.05 Manrope;letter-spacing:-.03em;margin-top:16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
.cd{background:var(--card);border:2px solid var(--edge);border-radius:30px;padding:40px 36px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 26px rgba(22,22,26,.05)}
.cd .n{font:800 22px Manrope;letter-spacing:.18em;color:var(--mut)}
.cd .en{font:800 54px/1.12 Manrope;letter-spacing:-.025em}
.cd .en i{font-style:normal;color:var(--acc)}
.tag{font-size:24px}
.ft{font-size:27px}
</style></head><body>
<div class="s L">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">Flashcard</div></div>
  <div class="mid">
    <div class="top">
      <div>
        <div class="h">"Мэдэхгүй" гэхийн<br>оронд хэрэглэх <em>8 үг</em></div>
      </div>
      <div class="deck">
        <div class="c2"></div>
        <div class="c1"><div class="fk">FRONT</div><div class="fw">I don't know</div></div>
      </div>
    </div>
    <div class="cards">
      <div class="cd"><div class="en">I'm <i>not sure</i></div></div>
      <div class="cd"><div class="en"><i>No idea</i></div></div>
      <div class="cd"><div class="en"><i>Beats</i> me</div></div>
      <div class="cd"><div class="en">I haven't a <i>clue</i></div></div>
      <div class="cd"><div class="en">Let me <i>check</i></div></div>
      <div class="cd"><div class="en"><i>Good question</i></div></div>
      <div class="cd"><div class="en">I'll <i>find out</i></div></div>
      <div class="cd"><div class="en">Your <i>guess</i> is as good as mine</div></div>
    </div>
  </div>
  <div class="ft"><span>Чи алийг нь илүү их хэрэглэх вэ?</span><span class="go">Хадгал →</span></div>
</div></body></html>
