<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.hud{margin-top:30px;font-size:26px}
.hud .lab{letter-spacing:.06em}
.h{font:800 72px/1.1 Manrope;letter-spacing:-.04em;margin-top:38px}
.h em{font-style:normal;color:var(--acc)}
.qbox{margin-top:40px;padding:42px 46px;box-shadow:14px 14px 0 var(--line)}
.qbox .qk{font:400 26px Silkscreen,monospace;color:var(--acc);letter-spacing:.02em}
.said{font:800 52px/1.15 Manrope;margin-top:22px;letter-spacing:-.02em}
.row{display:flex;align-items:baseline;gap:24px;margin-top:30px}
.row .k{font:400 26px Silkscreen,monospace;color:var(--mut);flex:0 0 150px}
.row .v{font:800 50px/1.15 Manrope;color:var(--mut);letter-spacing:-.02em}
.row.b .k{color:var(--acc)}
.row.b .v{color:var(--fg)}
.blank{width:300px;border-bottom:8px solid var(--acc);display:inline-block;height:34px}
.grid4{margin-top:42px;gap:26px}
.ob{padding:30px 32px;align-items:center;font-size:inherit;box-shadow:10px 10px 0 var(--line)}
.ob b{font:400 30px Silkscreen,monospace;padding:8px 16px;margin-top:4px}
.ob .en{font:800 44px/1.1 Manrope;letter-spacing:-.025em;color:var(--acc)}
.tag{font-size:24px}
.ft{font-size:26px}
</style></head><body>
<div class="s D">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">Quiz game</div></div>
  <div class="mid">
    <div class="hud"><span class="lab">BASIC &gt; BETTER</span><div class="xp"><i></i></div><span class="lab">DAY 08</span></div>
    <div class="h">Баярлалаа гэхэд чи<br><em>юу гэж</em> хариулдаг вэ?</div>
    <div class="qbox">
      <div class="qk">&gt; SOMEONE SAYS</div>
      <div class="said">Thanks a lot, you saved me!</div>
      <div class="row"><div class="k">BASIC</div><div class="v">You're welcome.</div></div>
      <div class="row b"><div class="k">BETTER</div><div class="v"><span class="blank"></span></div></div>
    </div>
    <div class="grid4">
      <div class="ob"><b>A</b><div><div class="en">No worries</div></div></div>
      <div class="ob"><b>B</b><div><div class="en">My pleasure</div></div></div>
      <div class="ob"><b>C</b><div><div class="en">Anytime</div></div></div>
      <div class="ob"><b>D</b><div><div class="en">Don't mention it</div></div></div>
    </div>
  </div>
  <div class="ft"><span>Хариултаа коммент хэсэгт үлдээгээрэй</span><span class="go">+50 XP</span></div>
</div></body></html>
