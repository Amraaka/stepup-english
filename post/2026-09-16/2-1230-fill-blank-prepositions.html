<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.h{font:800 58px/1.12 Manrope;letter-spacing:-.035em;margin:30px 0 0}
.h em{font-style:normal;color:var(--acc)}
.qbox{margin-top:36px;padding:34px 44px}
.q{display:flex;gap:26px;align-items:center;padding:22px 0;border-bottom:3px solid var(--edge)}
.q:last-child{border:0;padding-bottom:0}
.q:first-child{padding-top:0}
.q .num{font:400 28px Silkscreen,monospace;color:var(--acc);flex:0 0 52px}
.q .en{font:800 52px/1.15 Manrope;letter-spacing:-.02em}
.blank{display:inline-block;width:140px;border-bottom:7px solid var(--acc);margin:0 8px;vertical-align:6px}
.banklab{font:800 25px Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:36px}
.bank{display:flex;gap:16px;margin-top:18px}
.bank span{flex:1;border:5px solid var(--line);background:var(--card);box-shadow:8px 8px 0 var(--line);
  padding:16px 0;text-align:center;font:800 46px Manrope;letter-spacing:-.02em}
.tag{font-size:24px}
.ft{font-size:26px}
</style></head><body>
<div class="s L">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">Fill in the blank</div></div>
  <div class="mid">
    <div class="hud"><span>❤️❤️</span><div class="xp"><i></i></div><span>LVL 2</span></div>
    <div class="h">Доорх сонголтоос<br>аль нь <em>зөв</em> бэ?</div>
    <div class="qbox">
      <div class="q"><div class="num">01</div><div class="en">I'm<span class="blank"></span>the bus.</div></div>
      <div class="q"><div class="num">02</div><div class="en">She's<span class="blank"></span>home.</div></div>
      <div class="q"><div class="num">03</div><div class="en">Meet me<span class="blank"></span>5.</div></div>
      <div class="q"><div class="num">04</div><div class="en">He's good<span class="blank"></span>math.</div></div>
      <div class="q"><div class="num">05</div><div class="en">I'm interested<span class="blank"></span>art.</div></div>
    </div>
    <div class="banklab">Эдгээрээс сонго</div>
    <div class="bank"><span>in</span><span>on</span><span>at</span><span>to</span><span>of</span></div>
  </div>
  <div class="ft"><span>Хариултаа коммент хэсэгт үлдээгээрэй</span><span class="go">+50 XP</span></div>
</div></body></html>
