<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.mid{justify-content:center;padding:30px 0 30px}
.h1s{font-size:84px;margin:0 0 0}
.cards8{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:64px}
.card8{background:var(--card);border:3px solid var(--line);border-radius:32px;padding:26px 30px 30px;box-shadow:9px 9px 0 var(--line);position:relative;min-height:170px;display:flex;flex-direction:column}
.card8 .n{font:800 24px Manrope;letter-spacing:.16em;color:var(--mut)}
.card8 .en{font:800 48px/1.1 Manrope;letter-spacing:-.02em;margin-top:auto}
.card8 .en c{color:var(--acc);font-style:normal}
.ft{font-size:27px}
</style></head><body>
<div class="s L">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">Flashcard</div></div>
  <div class="mid">
    <div class="h1s">"Баяртай"-г <em>8 өөрөөр</em><br>хэлэх арга</div>
    <div class="cards8">
      <div class="card8"><div class="n">01</div><div class="en">See <c>you</c></div></div>
      <div class="card8"><div class="n">02</div><div class="en">Take <c>care</c></div></div>
      <div class="card8"><div class="n">03</div><div class="en">Catch you <c>later</c></div></div>
      <div class="card8"><div class="n">04</div><div class="en">Have a <c>good one</c></div></div>
      <div class="card8"><div class="n">05</div><div class="en">I'm <c>off</c></div></div>
      <div class="card8"><div class="n">06</div><div class="en">Talk <c>soon</c></div></div>
      <div class="card8"><div class="n">07</div><div class="en">Until <c>next time</c></div></div>
      <div class="card8"><div class="n">08</div><div class="en"><c>Safe</c> travels</div></div>
    </div>
  </div>
  <div class="ft"><span>Чи алийг нь хэлдэг вэ?</span><span class="go">Хадгал →</span></div>
</div></body></html>
