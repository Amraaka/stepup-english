<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.s.PP{--bg:#fbf8f1;--fg:#1a1a1f;--mut:#5c5c66;--edge:#1a1a1f;--acc:#ff5a3c;
  background-image:linear-gradient(#e9e4d8 2px,transparent 2px),linear-gradient(90deg,#e9e4d8 2px,transparent 2px);
  background-size:54px 54px}
.s.PP .brand .lg{border-color:#1a1a1f;border-width:3px}
.s.PP .tag{border-width:3px}
.fill{flex:1;display:flex;flex-direction:column;position:relative}
.stk{position:absolute;font-size:120px;line-height:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.16))}
.star{position:absolute;color:#f5a524;font:900 46px Rubik}
.hook{font:900 74px/1.08 Rubik,Manrope;letter-spacing:-.03em;text-transform:uppercase;margin:0}
.hook .c{color:#ff5a3c}
/* shared deck rhythm — identical y-positions on p2 / p3 / p4 */
.mnb{position:absolute;top:176px;left:0;right:0;height:252px;display:flex;align-items:flex-end}
.eqs{position:absolute;top:456px;left:0;font:900 64px/1 Rubik;color:#ff5a3c;letter-spacing:.02em}
.enb{position:absolute;top:548px;left:0;right:0}
.en{font:700 52px/1.24 Manrope;margin:0}
.chips{position:absolute;top:656px;left:0;right:0;display:flex;gap:16px;align-items:center;flex-wrap:nowrap;white-space:nowrap}
.chip{font:800 32px/1 Manrope;border:3px solid #b9b2a2;border-radius:999px;padding:15px 22px;color:#8b8478;
  text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:#c8361b}
.chip.ok{border-color:#ff5a3c;color:#c8361b;background:#ffe7e0;text-decoration:none}
/* closing CTA — bottom third */
.cta{position:absolute;top:816px;left:0;right:0;border:4px solid #1a1a1f;border-radius:30px;background:#fff;
  padding:30px 34px;box-shadow:10px 10px 0 rgba(26,26,31,.14)}
.cta .q{font:800 38px/1.2 Manrope;margin:0}
.cta .row{display:flex;gap:12px;align-items:center;margin-top:18px}
.cta .row em{font:700 30px/1 Manrope;font-style:normal;color:var(--mut);margin-right:6px}
.cta .n{font:900 32px/1 Rubik;color:#fff;background:#ff5a3c;border-radius:14px;padding:12px 22px}
.cta .save{font:700 46px/1 Caveat,cursive;color:#c8361b;margin-top:18px;display:block}
.s.PP .ft{color:#1a1a1f}
.s.PP .ft span:first-child{letter-spacing:.06em;font-weight:800}
</style></head><body>
<div class="s L PP">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">4 / 4</div></div>
  <div class="fill">
    <div class="star" style="top:44px;left:6px">★</div>
    <div class="stk" style="top:12px;right:20px;transform:rotate(-8deg)">🕊️</div>
    <div class="mnb"><p class="hook">Нэг сумаар<br>хоёр <span class="c">туулай</span></p></div>
    <div class="eqs">=</div>
    <div class="enb"><p class="en">“Kill two <b>birds</b> with one <b>stone</b>.”</p></div>
    <div class="chips">
      <span class="chip">туулай + сум?</span>
      <span class="chip ok">birds + stone ✓</span>
    </div>
    <div class="cta">
      <p class="q">Аль нь хамгийн гайхмаар вэ?</p>
      <div class="row"><em>Коммент дээр</em><span class="n">1</span><span class="n">2</span><span class="n">3</span></div>
      <span class="save">Хадгалаад найздаа илгээ →</span>
    </div>
  </div>
  <div class="ft"><span>@STEPUPENGLISH.MN</span><span></span></div>
</div></body></html>
