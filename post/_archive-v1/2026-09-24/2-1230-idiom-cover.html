<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.s.PP{--bg:#fbf8f1;--fg:#1a1a1f;--mut:#5c5c66;--edge:#1a1a1f;--acc:#ff5a3c;
  background-image:linear-gradient(#e9e4d8 2px,transparent 2px),linear-gradient(90deg,#e9e4d8 2px,transparent 2px);
  background-size:54px 54px}
.s.PP .brand .lg{border-color:#1a1a1f;border-width:3px}
.s.PP .tag{border-width:3px}
.fill{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.hook{font:900 100px/1.06 Rubik,Manrope;letter-spacing:-.02em;text-transform:uppercase;text-align:center;margin:0}
.hook .c{color:#ff5a3c}
.hook .a{color:#e08c0b}
.sub{font:700 38px/1.35 Manrope;text-align:center;margin-top:40px;color:var(--mut)}
.stk{position:absolute;font-size:130px;line-height:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.16))}
.star{position:absolute;color:#f5a524;font:900 52px Rubik}
.s.PP .ft{color:#1a1a1f}
.s.PP .ft span:first-child{letter-spacing:.06em;font-weight:800}
.note{font:700 56px/1 Caveat,cursive;color:#c8361b}
</style></head><body>
<div class="s L PP">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">1 / 4</div></div>
  <div class="fill">
    <div class="star" style="top:60px;left:30px">★</div>
    <div class="star" style="top:150px;right:60px">★</div>
    <div class="stk" style="top:0;right:40px;transform:rotate(12deg)">🐇</div>
    <div class="stk" style="bottom:110px;left:30px;transform:rotate(-10deg)">⏳</div>
    <p class="hook">Монголоор ч<br><span class="c">англиар ч</span><br>яг адилхан<br><span class="a">3</span> хэллэг</p>
    <div class="sub">Үгчлэн орчуулбал ч зөв гардаг.<br>Чи хэдийг нь мэддэг вэ?</div>
  </div>
  <div class="ft"><span>@STEPUPENGLISH.MN</span><span class="note">swipe →</span></div>
</div></body></html>
