<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.stack{height:580px;margin-top:30px}
.fc{width:780px;height:470px;padding:0 56px}
.fc.b1{background:#f7f5f0;border-color:#f7f5f0;box-shadow:none}
.fc .fk{font-size:25px;letter-spacing:.22em;color:#8a8a94}
.fc .fw{font:800 86px/1.06 Manrope;letter-spacing:-.035em;margin:24px 0 18px;color:#16161a}
.arrow{font:800 62px Manrope;color:#ff5a3c;letter-spacing:.08em}
.opts{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.opt{display:flex;align-items:center;gap:26px;background:var(--card);border:2px solid var(--edge);border-radius:26px;padding:19px 32px}
.opt b{flex:0 0 58px;height:58px;border-radius:16px;background:var(--card2);color:var(--mut);display:grid;place-items:center;font:800 30px Manrope}
.opt span{font:800 50px Manrope;letter-spacing:-.02em}
.ask{text-align:center;font:800 40px Manrope;margin:34px 0 30px;letter-spacing:-.01em}
.ask em{font-style:normal;color:var(--acc)}
</style></head><body>
<div class="s D">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">Flashcard</div></div>
  <div class="mid">
    <div class="stack">
      <div class="fc b3"></div><div class="fc b2"></div>
      <div class="fc b1">
        <div class="fk">УРД ТАЛ</div>
        <div class="fw">гэрийн<br>даалгавар</div>
        <div class="arrow">→  ?</div>
      </div>
    </div>
    <div class="opts">
      <div class="opt"><b>A</b><span>homework</span></div>
      <div class="opt"><b>B</b><span>homeworks</span></div>
      <div class="opt"><b>C</b><span>home work</span></div>
    </div>
    <div class="ask">Гуравны нэг нь л зөв. <em>Аль нь вэ?</em></div>
  </div>
  <div class="ft"><span>Хариуг Story-д тавина</span><span class="go">Коммент → A B C</span></div>
</div></body></html>
