<!doctype html><html lang="mn"><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/post.css">
<style>
.mid{justify-content:flex-start;padding-top:30px}
.h1s{font:800 76px/1.02 Manrope;letter-spacing:-.04em;margin:0;text-align:center}
.h1s em{font-style:normal;color:var(--acc)}
.no{font:800 26px Manrope;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);text-align:center;margin-bottom:16px}
.wd-grid{grid-template-columns:repeat(5,134px);gap:14px;margin-top:40px}
.wd-grid span{height:134px;font-size:70px;border-radius:10px}
.hint{margin-top:42px;font:700 38px/1.3 Manrope}
.hint small{display:block;font:600 29px Manrope;color:var(--mut);margin-top:10px}
.leg{margin-top:24px;font-size:26px}
.ask{margin-top:34px;text-align:center;font:800 38px/1.3 Manrope;background:var(--card);border:2px solid var(--edge);border-radius:28px;padding:24px 32px}
.ask em{font-style:normal;color:var(--acc)}
.ft{font-size:26px}
</style></head><body>
<div class="s D">
  <div class="hd"><div class="brand"><div class="lg"><img src="../templates/logo.svg" alt=""></div><div><b>StepUp <span>English</span></b><small>@stepupenglish.mn</small></div></div><div class="tag">Wordle</div></div>
  <div class="mid">
    <div class="no">Wordle Nº 2</div>
    <div class="h1s">Үлдсэн <em>хоёр нүд</em><br>чинийх шүү</div>
    <div class="wd-grid">
      <span class="x">H</span><span class="x">O</span><span class="p">U</span><span class="x">S</span><span class="ok">E</span>
      <span class="ok">Q</span><span class="ok">U</span><span class="ok">E</span><span class="x">S</span><span class="x">T</span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="hint">Сэжүүр: <b>банк, эмнэлэг, замын цагдаа</b><small>Хүн ихтэй газар заавал үүсдэг тэр юм.</small></div>
    <div class="leg"><span><i style="background:var(--acc)"></i>зөв байрандаа</span><span><i style="background:var(--acc2)"></i>үгэнд байгаа</span><span><i style="background:#3a3a44"></i>байхгүй</span></div>
    <div class="ask">Таасан бол <em>үгээ</em> коммент дээр бичээрэй 👇</div>
  </div>
  <div class="ft"><span>Wordle Nº 1 хариу: FROST ❄️</span><span class="go">2/6</span></div>
</div></body></html>
